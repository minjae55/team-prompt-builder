<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHy7x7gSC7rc6v4Ng0K9Pz5PqwSkUBHIg",
  authDomain: "kbeauty-ea966.firebaseapp.com",
  databaseURL: "https://kbeauty-ea966-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kbeauty-ea966",
  storageBucket: "kbeauty-ea966.firebasestorage.app",
  messagingSenderId: "348140230496",
  appId: "1:348140230496:web:bcd5109f93ec58568e3005"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// 전역으로 노출 (일반 script에서 접근)
window._fbDb  = db;
window._fbRef = ref;
window._fbSet = set;
window._fbGet = get;
window._fbPush = push;
window._fbReady = true;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
:root {
  --bg:        #0a0c10;
  --bg2:       #0f1218;
  --bg3:       #161b24;
  --bg4:       #1c2330;
  --border:    #1e2736;
  --border2:   #28364a;
  --text:      #e2e8f0;
  --text2:     #8899b4;
  --text3:     #4a5d78;
  --green:     #00d084;
  --green-bg:  #021a10;
  --blue:      #3b9eff;
  --blue-bg:   #021428;
  --amber:     #ffb043;
  --amber-bg:  #1a1200;
  --red:       #ff5c7a;
  --red-bg:    #1f0a10;
  --purple:    #a78bfa;
  --purple-bg: #130f24;
  --teal:      #2dd4bf;
  --teal-bg:   #021614;
  --radius:    10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 23px,
      rgba(59,158,255,0.02) 23px,
      rgba(59,158,255,0.02) 24px
    );
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 100;
  height: 54px;
  background: rgba(10,12,16,0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  color: #fff;
}
.logo-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  letter-spacing: 0.03em;
}
.logo-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--purple);
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.25);
  padding: 2px 8px;
  border-radius: 20px;
}
.header-right { display: flex; align-items: center; gap: 8px; }
.hchip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: var(--bg3);
}
.hchip.active {
  background: var(--purple-bg);
  border-color: rgba(167,139,250,0.35);
  color: var(--purple);
}

/* ── CONTEXT PANEL ── */
.context-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  max-height: 600px;
  position: relative;
  z-index: 1;
}
.context-panel.collapsed { max-height: 0; }

.ctx-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.ctx-panel-header:hover { background: var(--bg3); }
.ctx-panel-header-left { display: flex; align-items: center; gap: 10px; }
.ctx-panel-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.05em;
}

/* 공유 vs 개인 배지 */
.sync-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.sync-badge.shared {
  color: var(--green); background: var(--green-bg);
  border: 1px solid rgba(0,208,132,0.25);
}
.sync-badge.personal {
  color: var(--amber); background: var(--amber-bg);
  border: 1px solid rgba(255,176,67,0.25);
}
.sync-badge.syncing {
  color: var(--blue); background: var(--blue-bg);
  border: 1px solid rgba(59,158,255,0.25);
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.ctx-chevron { color: var(--text3); font-size: 10px; transition: transform 0.2s; }
.ctx-chevron.open { transform: rotate(180deg); }

.ctx-fields-wrap {
  padding: 16px 22px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ctx-field { display: flex; flex-direction: column; gap: 5px; }
.ctx-field-full { grid-column: 1 / -1; }

.ctx-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.ctx-field-label .field-badge {
  font-size: 8px; padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
}
.field-badge.shared { color: var(--green); background: var(--green-bg); border: 1px solid rgba(0,208,132,0.2); }
.field-badge.personal { color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(255,176,67,0.2); }

.ctx-input {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 8px 11px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
  width: 100%;
}
.ctx-input.shared-field:focus { border-color: var(--green); }
.ctx-input.personal-field:focus { border-color: var(--amber); }
.ctx-input::placeholder { color: var(--text3); }

.ctx-footer {
  padding: 10px 22px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ctx-save-btn {
  padding: 7px 18px;
  background: var(--green-bg);
  border: 1px solid rgba(0,208,132,0.3);
  border-radius: var(--radius-sm);
  color: var(--green);
  font-family: 'Pretendard', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
}
.ctx-save-btn:hover { background: var(--green); color: #000; }
.ctx-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.ctx-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.ctx-status.ok { color: var(--green); }
.ctx-status.err { color: var(--red); }
.ctx-status.syncing { color: var(--blue); }

/* ── CONTEXT BANNER ── */
.context-banner {
  display: none;
  padding: 8px 22px;
  background: linear-gradient(90deg, rgba(19,15,36,0.85), transparent);
  border-bottom: 1px solid rgba(167,139,250,0.12);
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  position: relative; z-index: 1;
}
.context-banner.visible { display: flex; }
.ctx-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid rgba(167,139,250,0.22);
  color: var(--purple);
  background: var(--purple-bg);
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ctx-tag.personal-tag {
  border-color: rgba(255,176,67,0.22);
  color: var(--amber);
  background: var(--amber-bg);
}
.ctx-banner-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.ctx-edit-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: transparent;
  cursor: pointer;
  transition: all 0.12s;
  margin-left: auto;
}
.ctx-edit-btn:hover { color: var(--text2); border-color: var(--border2); background: var(--bg3); }

/* ── MAIN LAYOUT ── */
.main {
  position: relative; z-index: 1;
  display: flex;
  height: calc(100vh - 54px);
  overflow: hidden;
}

/* ── PROMPT PANEL (left) ── */
.prompt-panel {
  width: 360px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  height: 100%;
  overflow: hidden;
}
.panel-head {
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.panel-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
}
.panel-stats { display: flex; gap: 14px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.stat-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 700;
  color: var(--purple);
  line-height: 1;
}
.stat-l { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }

.prompt-output {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.prompt-output::-webkit-scrollbar { width: 4px; }
.prompt-output::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.empty-state {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  color: var(--text3);
}
.empty-icon {
  width: 52px; height: 52px;
  border: 1px dashed var(--border2);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.empty-state p {
  font-size: 12px; text-align: center;
  line-height: 1.7; max-width: 200px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
}

/* prompt blocks */
.pblock { margin-bottom: 18px; }
.pblock:last-child { margin-bottom: 0; }
.psec-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.psec-label::before {
  content: ''; width: 14px; height: 1px;
  background: var(--border2);
}
.pline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px; line-height: 1.75;
  color: var(--text2);
  padding: 9px 12px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--border2);
  margin-bottom: 5px;
}
.pline:last-child { margin-bottom: 0; }
.pline.c-green  { border-left-color: var(--green); }
.pline.c-blue   { border-left-color: var(--blue); }
.pline.c-amber  { border-left-color: var(--amber); }
.pline.c-red    { border-left-color: var(--red); }
.pline.c-purple { border-left-color: var(--purple); }
.pline.c-teal   { border-left-color: var(--teal); }

/* action buttons */
.panel-actions {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 7px;
  flex-shrink: 0;
  background: var(--bg2);
}
.btn {
  width: 100%;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-family: 'Pretendard', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
  font-weight: 700;
}
.btn-primary:hover { background: #b89ffb; }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary {
  background: var(--bg3); color: var(--text2);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--bg4); color: var(--text); border-color: var(--border2); }
.btn-ghost {
  background: transparent; color: var(--text3);
  border-color: var(--border); font-size: 12px;
}
.btn-ghost:hover { color: var(--red); border-color: rgba(255,92,122,0.35); background: var(--red-bg); }
.btn-row { display: flex; gap: 7px; }
.btn-row .btn { flex: 1; }

/* ── OPTIONS PANEL (right) ── */
.options-panel {
  flex: 1;
  overflow-y: auto;
  height: 100%;
  padding: 18px 22px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.options-panel::-webkit-scrollbar { width: 4px; }
.options-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section {
  margin-bottom: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.section:hover { border-color: var(--border2); }
.section.has-checked { border-color: var(--border2); }

.sec-head {
  padding: 11px 15px;
  display: flex; align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.sec-head:hover { background: var(--bg3); }
.sec-head-left { display: flex; align-items: center; gap: 9px; }

.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.badge-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid rgba(0,208,132,0.2); }
.badge-blue   { background: var(--blue-bg);   color: var(--blue);   border: 1px solid rgba(59,158,255,0.2); }
.badge-amber  { background: var(--amber-bg);  color: var(--amber);  border: 1px solid rgba(255,176,67,0.2); }
.badge-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid rgba(255,92,122,0.2); }
.badge-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.2); }
.badge-teal   { background: var(--teal-bg);   color: var(--teal);   border: 1px solid rgba(45,212,191,0.2); }

.sec-title { font-size: 13px; font-weight: 600; color: var(--text); }
.sec-cnt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  background: var(--purple-bg);
  color: var(--purple);
  padding: 2px 6px; border-radius: 10px;
  border: 1px solid rgba(167,139,250,0.25);
  display: none;
}
.chevron { color: var(--text3); font-size: 10px; transition: transform 0.18s; }
.chevron.open { transform: rotate(180deg); }

.sec-body {
  border-top: 1px solid var(--border);
  padding: 7px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.sec-body.collapsed { display: none; }

.item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.item:hover { background: var(--bg3); border-color: var(--border); }
.item.checked {
  background: var(--purple-bg);
  border-color: rgba(167,139,250,0.2);
}
.item input[type=checkbox] {
  width: 13px; height: 13px;
  margin-top: 2px; cursor: pointer;
  flex-shrink: 0;
  accent-color: var(--purple);
}
.item-label { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
.item-sub {
  font-size: 10.5px; color: var(--text3);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.4;
}

/* custom items */
.custom-items-wrap {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.add-trigger {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 12px; margin-top: 3px;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text3);
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: all 0.14s;
  user-select: none;
}
.add-trigger:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-bg); }

.add-form {
  grid-column: 1 / -1;
  display: none; flex-direction: column; gap: 8px;
  padding: 10px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  margin-top: 4px;
}
.add-form.open { display: flex; }
.add-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 3px;
}
.custom-input {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
}
.custom-input:focus { border-color: var(--purple); }
.custom-input::placeholder { color: var(--text3); }
.add-actions { display: flex; gap: 6px; justify-content: flex-end; }
.add-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text3);
  font-family: 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 600;
  padding: 5px 10px; cursor: pointer;
}
.add-cancel:hover { color: var(--text2); }
.add-save {
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.3);
  border-radius: var(--radius-sm);
  color: var(--purple);
  font-family: 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 5px 12px; cursor: pointer;
  transition: all 0.14s;
}
.add-save:hover { background: var(--purple); color: #fff; }

.custom-item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.custom-item:hover { background: var(--bg3); border-color: var(--border); }
.custom-item.checked { background: var(--purple-bg); border-color: rgba(167,139,250,0.2); }
.custom-item input[type=checkbox] { width: 13px; height: 13px; margin-top: 2px; accent-color: var(--purple); flex-shrink: 0; cursor: pointer; }
.custom-del {
  background: transparent; border: none;
  color: var(--text3); cursor: pointer;
  font-size: 12px; padding: 1px 5px;
  border-radius: 4px;
  transition: color 0.14s, background 0.14s;
  margin-left: auto; flex-shrink: 0;
}
.custom-del:hover { color: var(--red); background: var(--red-bg); }

/* toast */
.toast {
  position: fixed; bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--purple); color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 700;
  padding: 9px 20px; border-radius: 30px;
  z-index: 999;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── LEGEND ── */
.legend {
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text3);
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 6px; height: 6px; border-radius: 50%; }
.legend-dot.shared { background: var(--green); }
.legend-dot.personal { background: var(--amber); }

/* ── VIEW BUILDER ── */
.view-builder {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, rgba(2,22,20,0.8), rgba(15,18,24,0.8));
  border: 1px solid rgba(45,212,191,0.2);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 6px;
}
.view-builder-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.view-builder-dot {
  width: 7px; height: 7px;
  background: var(--teal);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--teal);
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow { 0%,100%{opacity:1;box-shadow:0 0 6px var(--teal)} 50%{opacity:0.5;box-shadow:0 0 2px var(--teal)} }
.view-builder-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--teal);
}
.view-builder-desc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  margin-left: auto;
}

.view-field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.view-field { display: flex; flex-direction: column; gap: 4px; }
.view-field-full { grid-column: 1 / -1; }
.view-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
}
.view-input {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
  width: 100%;
}
.view-input:focus { border-color: var(--teal); }
.view-input::placeholder { color: var(--text3); }

.mood-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}
.mood-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}
.mood-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: transparent;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}
.mood-chip:hover { border-color: var(--teal); color: var(--teal); background: rgba(45,212,191,0.05); }
.mood-chip.active {
  background: var(--teal-bg);
  border-color: rgba(45,212,191,0.45);
  color: var(--teal);
}

.view-footer {
  display: flex; align-items: center; gap: 10px;
  justify-content: space-between;
  margin-top: 4px;
}
.view-preview-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  font-style: italic;
}
.view-apply-btn {
  padding: 7px 18px;
  background: var(--teal-bg);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: var(--radius-sm);
  color: var(--teal);
  font-family: 'Pretendard', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
  display: flex; align-items: center; gap: 6px;
}
.view-apply-btn:hover { background: var(--teal); color: #000; }

.view-divider {
  height: 1px; background: var(--border);
  margin: 10px 0;
  grid-column: 1 / -1;
}
.view-options-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  grid-column: 1 / -1;
  margin-bottom: 2px;
}

/* ── WORKSPACE OVERLAY ── */
.ws-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.ws-overlay.hidden { display: none; }

.ws-modal {
  width: 100%; max-width: 520px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.ws-modal-head {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--border);
}
.ws-modal-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.ws-modal-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 700; color: #fff;
}
.ws-modal-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  line-height: 1.2;
}
.ws-modal-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

.ws-tabs {
  display: flex; gap: 0;
  background: var(--bg3);
  border-radius: 8px;
  padding: 3px;
  width: fit-content;
}
.ws-tab {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text3);
  transition: all 0.15s;
  user-select: none;
  border: none; background: transparent;
}
.ws-tab.active { background: var(--bg4); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

.ws-modal-body { padding: 20px 28px 24px; }

/* 방 목록 */
.ws-room-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-height: 60px; }
.ws-room-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
}
.ws-room-item:hover { border-color: var(--purple); background: var(--purple-bg); }
.ws-room-item.personal { }
.ws-room-item.personal:hover { border-color: var(--amber); background: var(--amber-bg); }

.ws-room-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: var(--bg4);
}
.ws-room-icon.team { background: var(--purple-bg); }
.ws-room-icon.personal { background: var(--amber-bg); }

.ws-room-info { flex: 1; min-width: 0; }
.ws-room-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-room-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 2px; }

.ws-room-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.ws-room-badge.team { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.25); }
.ws-room-badge.solo { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,176,67,0.25); }

.ws-room-del {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: transparent; border: none;
  color: var(--text3); font-size: 12px;
  padding: 4px 7px; border-radius: 4px;
  cursor: pointer; opacity: 0;
  transition: all 0.12s;
}
.ws-room-item:hover .ws-room-del { opacity: 1; }
.ws-room-del:hover { color: var(--red); background: var(--red-bg); }

.ws-empty-rooms {
  text-align: center; padding: 20px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text3);
}

/* 새 방 만들기 폼 */
.ws-new-form { display: flex; flex-direction: column; gap: 12px; }
.ws-field { display: flex; flex-direction: column; gap: 5px; }
.ws-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
}
.ws-input {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.14s;
  width: 100%;
}
.ws-input:focus { border-color: var(--purple); }
.ws-input::placeholder { color: var(--text3); }

.ws-type-select {
  display: flex; gap: 8px;
}
.ws-type-btn {
  flex: 1; padding: 10px 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.14s;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  user-select: none;
}
.ws-type-btn:hover { border-color: var(--border2); background: var(--bg4); }
.ws-type-btn.selected.team { border-color: rgba(167,139,250,0.5); background: var(--purple-bg); }
.ws-type-btn.selected.solo { border-color: rgba(255,176,67,0.5); background: var(--amber-bg); }
.ws-type-icon { font-size: 20px; }
.ws-type-label { font-size: 12px; font-weight: 700; color: var(--text); }
.ws-type-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); text-align: center; }

.ws-code-row { display: flex; gap: 6px; align-items: center; }
.ws-code-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text3);
  line-height: 1.5;
}

.ws-create-btn {
  width: 100%;
  padding: 11px;
  background: var(--purple);
  border: none; border-radius: var(--radius-sm);
  color: #fff;
  font-family: 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.ws-create-btn:hover { background: #b89ffb; }
.ws-create-btn:active { transform: scale(0.98); }

/* 방 참가 탭 */
.ws-join-form { display: flex; flex-direction: column; gap: 12px; }
.ws-join-btn {
  width: 100%; padding: 11px;
  background: var(--blue-bg);
  border: 1px solid rgba(59,158,255,0.3);
  border-radius: var(--radius-sm);
  color: var(--blue);
  font-family: 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.ws-join-btn:hover { background: var(--blue); color: #fff; }

/* 헤더 워크스페이스 표시 */
.ws-header-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 12px 4px 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}
.ws-header-btn:hover { border-color: var(--purple); background: var(--purple-bg); }
.ws-header-icon { font-size: 13px; }
.ws-header-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  color: var(--text2);
  max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ws-header-type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  padding: 1px 6px; border-radius: 10px;
}
.ws-header-type.team { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.25); }
.ws-header-type.solo { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,176,67,0.25); }

/* ── INVITE CODE COPY ── */
.ws-code-copy-btn {
  padding: 8px 14px;
  background: var(--teal-bg);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: var(--radius-sm);
  color: var(--teal);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 0.14s;
}
.ws-code-copy-btn:hover { background: var(--teal); color: #000; }
.ws-code-copy-btn.copied { background: var(--green); color: #000; border-color: var(--green); }

/* ── TEAM ACTIVITY FEED ── */
.ws-room-item-wrap { display: flex; flex-direction: column; gap: 0; }
.ws-room-item-wrap .ws-room-item {
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  border-bottom: none;
}
.ws-room-item-wrap .ws-room-item.no-feed {
  border-radius: var(--radius-sm);
  border-bottom: 1px solid var(--border);
}

.ws-activity-panel {
  background: var(--bg4);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s ease;
}
.ws-activity-panel.open { max-height: 260px; }

.ws-activity-header {
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.ws-activity-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.ws-activity-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 4px var(--green);
}
.ws-activity-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
}

.ws-feed-list {
  overflow-y: auto; max-height: 200px;
  padding: 6px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.ws-feed-empty {
  padding: 16px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text3);
  text-align: center;
}
.ws-feed-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 14px;
  transition: background 0.1s;
}
.ws-feed-item:hover { background: rgba(255,255,255,0.02); }
.ws-feed-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; color: var(--purple);
}
.ws-feed-body { flex: 1; min-width: 0; }
.ws-feed-top {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 2px;
}
.ws-feed-part {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 120px;
}
.ws-feed-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  flex-shrink: 0;
}
.ws-feed-tags {
  display: flex; flex-wrap: wrap; gap: 3px;
}
.ws-feed-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 1px 6px; border-radius: 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text3);
  white-space: nowrap;
}
.ws-feed-tag.view  { color: var(--teal);   border-color: rgba(45,212,191,0.2);  background: var(--teal-bg); }
.ws-feed-tag.be    { color: var(--green);  border-color: rgba(0,208,132,0.2);   background: var(--green-bg); }
.ws-feed-tag.fe    { color: var(--blue);   border-color: rgba(59,158,255,0.2);  background: var(--blue-bg); }
.ws-feed-tag.debug { color: var(--red);    border-color: rgba(255,92,122,0.2);  background: var(--red-bg); }
.ws-feed-tag.plan  { color: var(--purple); border-color: rgba(167,139,250,0.2); background: var(--purple-bg); }

/* ── EXTRA INPUT ── */
.extra-input-wrap {
  padding: 10px 18px 0;
  flex-shrink: 0;
}
.extra-input-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 5px;
  display: flex; align-items: center; justify-content: space-between;
}
.extra-input-clear {
  background: none; border: none;
  color: var(--text3); font-size: 10px;
  cursor: pointer; font-family: 'JetBrains Mono', monospace;
  padding: 0;
}
.extra-input-clear:hover { color: var(--red); }
.extra-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 9px 11px;
  outline: none;
  resize: none;
  transition: border-color 0.14s;
  line-height: 1.6;
}
.extra-textarea:focus { border-color: var(--purple); }
.extra-textarea::placeholder { color: var(--text3); }
</head>
<body>

<!-- WORKSPACE OVERLAY -->
<div class="ws-overlay" id="ws-overlay" onclick="handleOverlayClick(event)">
  <div class="ws-modal">
    <div class="ws-modal-head">
      <div class="ws-modal-logo">
        <div class="ws-modal-icon">TP</div>
        <div>
          <div class="ws-modal-title">Team Prompt Builder</div>
          <div class="ws-modal-sub">워크스페이스를 선택하거나 새로 만들어요</div>
        </div>
      </div>
      <div class="ws-tabs">
        <button class="ws-tab active" id="tab-list" onclick="switchWsTab('list')">내 워크스페이스</button>
        <button class="ws-tab" id="tab-new" onclick="switchWsTab('new')">새로 만들기</button>
        <button class="ws-tab" id="tab-join" onclick="switchWsTab('join')">초대코드 입장</button>
      </div>
    </div>
    <div class="ws-modal-body">

      <!-- 목록 탭 -->
      <div id="ws-tab-list">
        <div class="ws-room-list" id="ws-room-list"></div>
      </div>

      <!-- 새로 만들기 탭 -->
      <div id="ws-tab-new" style="display:none">
        <div class="ws-new-form">
          <div class="ws-field">
            <div class="ws-field-label">워크스페이스 이름</div>
            <input class="ws-input" id="ws-new-name" placeholder="예) 중고거래 프로젝트, 캡스톤 팀A, 개인 작업" />
          </div>
          <div class="ws-field">
            <div class="ws-field-label">유형</div>
            <div class="ws-type-select">
              <div class="ws-type-btn selected team" id="wstype-team" onclick="selectWsType('team')">
                <span class="ws-type-icon">👥</span>
                <span class="ws-type-label">팀 공유</span>
                <span class="ws-type-sub">컨텍스트를 팀원과<br>함께 공유</span>
              </div>
              <div class="ws-type-btn solo" id="wstype-solo" onclick="selectWsType('solo')">
                <span class="ws-type-icon">🧑‍💻</span>
                <span class="ws-type-label">개인 전용</span>
                <span class="ws-type-sub">나만 쓰는<br>개인 공간</span>
              </div>
            </div>
          </div>
          <div class="ws-field" id="ws-code-field">
            <div class="ws-field-label">초대코드 (팀원에게 공유할 코드)</div>
            <div class="ws-code-row">
              <input class="ws-input" id="ws-new-code" placeholder="자동 생성됩니다" readonly
                style="flex:1;cursor:pointer;color:var(--teal);letter-spacing:0.12em;font-weight:700;"
                onclick="copyInviteCode('ws-new-code')" title="클릭해서 복사" />
              <button class="ws-code-copy-btn" id="copy-new-code-btn" onclick="copyInviteCode('ws-new-code')">📋 복사</button>
              <button onclick="regenCode()" style="padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap;font-family:'JetBrains Mono',monospace;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">↺</button>
            </div>
            <div class="ws-code-hint">클릭하면 복사돼요 · 팀원에게 공유하면 같은 컨텍스트를 함께 써요</div>
          </div>
          <button class="ws-create-btn" onclick="createWorkspace()">+ 워크스페이스 만들기</button>
        </div>
      </div>

      <!-- 초대코드 입장 탭 -->

<script>
// ====================== STORAGE KEYS ======================
const WS_LIST_KEY    = 'tp_workspaces';       // 내 워크스페이스 목록 (local)
const WS_CURRENT_KEY = 'tp_current_ws';       // 현재 선택된 ws id (local)
const VIEW_BUILDER_KEY = 'team_prompt_view_builder';

// 워크스페이스 ID 기반 키 생성
function wsSharedKey(wsId)   { return `tp_shared_${wsId}`; }
function wsPersonalKey(wsId) { return `tp_personal_${wsId}`; }
function wsSelectedKey(wsId) { return `tp_selected_${wsId}`; }
function wsCustomKey(wsId)   { return `tp_custom_${wsId}`; }

// ====================== WORKSPACE STATE ======================
let currentWs = null;  // { id, name, type:'team'|'solo', code? }
let wsNewType = 'team';

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const seg = n => Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  return `${seg(3)}-${seg(4)}`;
}

function regenCode() {
  document.getElementById('ws-new-code').value = genCode();
}

function selectWsType(type) {
  wsNewType = type;
  document.getElementById('wstype-team').className = `ws-type-btn team${type==='team'?' selected':''}`;
  document.getElementById('wstype-solo').className = `ws-type-btn solo${type==='solo'?' selected':''}`;
  document.getElementById('ws-code-field').style.display = type === 'team' ? '' : 'none';
}

function switchWsTab(tab) {
  ['list','new','join'].forEach(t => {
    document.getElementById(`ws-tab-${t}`).style.display = t===tab ? '' : 'none';
    document.getElementById(`tab-${t}`).classList.toggle('active', t===tab);
  });
  if (tab === 'new' && !document.getElementById('ws-new-code').value) {
    document.getElementById('ws-new-code').value = genCode();
  }
}

// ── 내 워크스페이스 목록 로드
function loadWsList() {
  try {
    const raw = localStorage.getItem(WS_LIST_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveWsList(list) {
  try { localStorage.setItem(WS_LIST_KEY, JSON.stringify(list)); } catch(e) {}
}

// ── 워크스페이스 만들기
function createWorkspace() {
  const name = document.getElementById('ws-new-name').value.trim();
  if (!name) {
    const el = document.getElementById('ws-new-name');
    el.focus(); el.style.borderColor = 'var(--red)';
    setTimeout(() => el.style.borderColor = '', 1500); return;
  }
  const code = wsNewType === 'team' ? document.getElementById('ws-new-code').value.trim() : null;
  // 팀방 ID = 코드 기반 (같은 코드 = 같은 방), 개인방 = 랜컵
  const id = wsNewType === 'team' ? `team_${code.replace('-','')}` : `solo_${Date.now()}`;
  const ws = { id, name, type: wsNewType, code, createdAt: Date.now() };

  const list = loadWsList();
  // 이미 같은 id가 있으면 업데이트
  const idx = list.findIndex(w => w.id === id);
  if (idx >= 0) list[idx] = ws; else list.unshift(ws);
  saveWsList(list);

  enterWorkspace(ws);
}

// ── 초대코드로 입장
function joinWorkspace() {
  const rawCode = document.getElementById('ws-join-code').value.trim().toUpperCase();
  const name    = document.getElementById('ws-join-name').value.trim();
  if (!rawCode || !name) {
    const el = !rawCode ? document.getElementById('ws-join-code') : document.getElementById('ws-join-name');
    el.focus(); el.style.borderColor = 'var(--red)';
    setTimeout(() => el.style.borderColor = '', 1500); return;
  }
  const code = rawCode.includes('-') ? rawCode : `${rawCode.slice(0,3)}-${rawCode.slice(3)}`;
  const id   = `team_${code.replace('-','')}`;
  const ws   = { id, name, type: 'team', code, createdAt: Date.now() };

  const list = loadWsList();
  const idx  = list.findIndex(w => w.id === id);
  if (idx >= 0) list[idx].name = name; else list.unshift(ws);
  saveWsList(list);

  enterWorkspace(ws);
}

// ── 워크스페이스 입장
function enterWorkspace(ws) {
  currentWs = ws;
  try { localStorage.setItem(WS_CURRENT_KEY, ws.id); } catch(e) {}
  closeWsOverlay();
  updateWsHeader();
  // 해당 ws 데이터로 컨텍스트/선택 초기화 후 로드
  resetToWs(ws);
}

function updateWsHeader() {
  if (!currentWs) return;
  document.getElementById('ws-header-name').textContent = currentWs.name;
  document.getElementById('ws-header-icon').textContent = currentWs.type === 'team' ? '👥' : '🧑‍💻';
  const badge = document.getElementById('ws-header-type');
  badge.textContent = currentWs.type === 'team' ? 'TEAM' : 'SOLO';
  badge.className = `ws-header-type ${currentWs.type}`;
}

// ── 초대코드 복사
function copyInviteCode(inputId) {
  const val = document.getElementById(inputId)?.value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.getElementById('copy-new-code-btn');
    if (btn) { btn.textContent = '✓ 복사됨'; btn.classList.add('copied'); }
    setTimeout(() => { if(btn){btn.textContent='📋 복사';btn.classList.remove('copied');} }, 1800);
    showToastMsg('초대코드 복사됨!');
  });
}

// ── 활동 피드 저장/로드 (Firebase 팀 공유)
function wsFeedKey(wsId) { return `tp_feed_${wsId}`; }

async function loadFeed(wsId) {
  const ws = loadWsList().find(w => w.id === wsId);
  try {
    if (ws && ws.type === 'team') {
      const val = await fbGet(`workspaces/${wsId}/feed`);
      if (val) return Object.values(val).sort((a, b) => b.ts - a.ts);
      return [];
    }
  } catch(e) { console.warn('Firebase feed load failed', e); }
  try {
    const v = localStorage.getItem(wsFeedKey(wsId));
    if (v) return JSON.parse(v);
  } catch(e) {}
  return [];
}

async function saveFeedItem(wsId, item) {
  const ws = loadWsList().find(w => w.id === wsId);
  try {
    if (ws && ws.type === 'team') {
      await fbPush(`workspaces/${wsId}/feed`, item);
      return;
    }
  } catch(e) { console.warn('Firebase feed save failed', e); }
  try {
    const feed = JSON.parse(localStorage.getItem(wsFeedKey(wsId)) || '[]');
    feed.unshift(item);
    localStorage.setItem(wsFeedKey(wsId), JSON.stringify(feed.slice(0, 30)));
  } catch(e) {}
}

function makeFeedTags() {
  const tags = [];
  const hasView = viewPromptActive && window._viewGeneratedPrompt;
  if (hasView) tags.push({ label: '🎨 뷰 생성', cls: 'view' });
  DATA.forEach(sec => {
    const n = sec.items.filter(i => selected.has(i.id)).length
            + ((customItems[sec.id]||[]).filter(i=>selected.has(i.id)).length);
    if (!n) return;
    const cls = sec.id.startsWith('pimpl') ? 'be'
              : sec.id === 'pfront' ? 'fe'
              : sec.id === 'pdebug' ? 'debug'
              : sec.id.startsWith('pplan') ? 'plan' : '';
    tags.push({ label: `${sec.title.split(' ').slice(0,2).join(' ')} ×${n}`, cls });
  });
  return tags;
}

// ── 워크스페이스 목록 렌더링 (활동 피드 포함)
async function renderWsList() {
  const list = loadWsList();
  const el   = document.getElementById('ws-room-list');
  if (!list.length) {
    el.innerHTML = '<div class="ws-empty-rooms">아직 워크스페이스가 없어요<br>새로 만들거나 초대코드로 입장해봐요</div>';
    return;
  }

  // 먼저 기본 렌더
  el.innerHTML = list.map(ws => {
    const isTeam = ws.type === 'team';
    const codeHtml = isTeam
      ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
           <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--teal);letter-spacing:0.1em;">${ws.code}</span>
           <button onclick="event.stopPropagation();copyCodeDirect('${ws.code}')" style="font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 7px;background:var(--teal-bg);border:1px solid rgba(45,212,191,0.3);border-radius:10px;color:var(--teal);cursor:pointer;" id="ccbtn-${ws.id}">복사</button>
         </div>` : '';
    return `
    <div class="ws-room-item-wrap" id="wrap-${ws.id}">
      <div class="ws-room-item ${ws.type}${isTeam?' team-expandable':' no-feed'}" onclick="${isTeam?`toggleFeedPanel('${ws.id}')`:''};${!isTeam?`enterWorkspace(${JSON.stringify(ws).replace(/"/g,'&quot;')})`:''}" id="ri-${ws.id}">
        <div class="ws-room-icon ${ws.type}">${isTeam?'👥':'🧑‍💻'}</div>
        <div class="ws-room-info">
          <div class="ws-room-name">${escHtml(ws.name)}</div>
          <div class="ws-room-meta">${isTeam ? `초대코드` : '개인 전용'} · ${timeAgo(ws.createdAt)}</div>
          ${codeHtml}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
          <span class="ws-room-badge ${ws.type}">${isTeam?'TEAM':'SOLO'}</span>
          ${isTeam ? `<span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);" id="chev-feed-${ws.id}">▼ 활동</span>` : ''}
        </div>
        <button class="ws-room-del" onclick="event.stopPropagation();deleteWs('${ws.id}')">✕</button>
      </div>
      ${isTeam ? `
      <div class="ws-activity-panel" id="feed-panel-${ws.id}">
        <div class="ws-activity-header">
          <div class="ws-activity-title"><div class="ws-activity-dot"></div>팀 활동 피드</div>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="ws-activity-count" id="feed-cnt-${ws.id}">로딩 중...</span>
            <button onclick="event.stopPropagation();enterWorkspace(${JSON.stringify(ws).replace(/"/g,'&quot;')})"
              style="font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 10px;background:var(--purple-bg);border:1px solid rgba(167,139,250,0.3);border-radius:10px;color:var(--purple);cursor:pointer;">
              → 입장
            </button>
          </div>
        </div>
        <div class="ws-feed-list" id="feed-list-${ws.id}">
          <div class="ws-feed-empty">클릭해서 활동 기록을 불러와요</div>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

let openFeedPanels = new Set();

async function toggleFeedPanel(wsId) {
  const panel = document.getElementById(`feed-panel-${wsId}`);
  const chev  = document.getElementById(`chev-feed-${wsId}`);
  const item  = document.getElementById(`ri-${wsId}`);
  if (!panel) return;

  if (openFeedPanels.has(wsId)) {
    openFeedPanels.delete(wsId);
    panel.classList.remove('open');
    if(chev) chev.textContent = '▼ 활동';
    if(item) { item.style.borderRadius = ''; item.style.borderBottom = ''; }
  } else {
    openFeedPanels.add(wsId);
    panel.classList.add('open');
    if(chev) chev.textContent = '▲ 활동';
    if(item) { item.style.borderRadius = 'var(--radius-sm) var(--radius-sm) 0 0'; item.style.borderBottom = 'none'; }
    await renderFeedPanel(wsId);
  }
}

async function renderFeedPanel(wsId) {
  const listEl = document.getElementById(`feed-list-${wsId}`);
  const cntEl  = document.getElementById(`feed-cnt-${wsId}`);
  if (!listEl) return;

  listEl.innerHTML = '<div class="ws-feed-empty" style="color:var(--blue)">불러오는 중...</div>';
  const feed = await loadFeed(wsId);

  if (!feed.length) {
    listEl.innerHTML = '<div class="ws-feed-empty">아직 활동 기록이 없어요<br>프롬프트를 복사하면 여기 기록돼요</div>';
    if (cntEl) cntEl.textContent = '0건';
    return;
  }

  if (cntEl) cntEl.textContent = `${feed.length}건`;
  listEl.innerHTML = feed.map(f => `
    <div class="ws-feed-item">
      <div class="ws-feed-avatar">${f.part ? f.part[0].toUpperCase() : '?'}</div>
      <div class="ws-feed-body">
        <div class="ws-feed-top">
          <span class="ws-feed-part">${escHtml(f.part || '익명')}</span>
          <span class="ws-feed-time">${timeAgo(f.ts)}</span>
        </div>
        <div class="ws-feed-tags">
          ${(f.tags||[]).map(t=>`<span class="ws-feed-tag ${t.cls}">${escHtml(t.label)}</span>`).join('')}
          ${(!f.tags||!f.tags.length)?'<span class="ws-feed-tag">기타</span>':''}
        </div>
      </div>
    </div>
  `).join('');
}

function copyCodeDirect(code) {
  navigator.clipboard.writeText(code).then(() => showToastMsg('초대코드 복사됨!'));
}

function handleOverlayClick(e) {
  // 모달 바깥(오버레이 배경) 클릭 시만 닫기
  if (e.target === document.getElementById('ws-overlay')) {
    // 워크스페이스가 없으면 닫지 않음 (강제 선택)
    if (currentWs) closeWsOverlay();
  }
}

function deleteWs(id) {
  const ws = loadWsList().find(w => w.id === id);
  const name = ws ? ws.name : '이 워크스페이스';
  if (!confirm(`"${name}"을 삭제할까요?\n삭제하면 복구할 수 없어요.`)) return;
  const list = loadWsList().filter(w => w.id !== id);
  saveWsList(list);
  if (currentWs && currentWs.id === id) {
    currentWs = null;
    try { localStorage.removeItem(WS_CURRENT_KEY); } catch(e) {}
    openWsOverlay();
  }
  renderWsList();
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const d = Math.floor(diff / 86400000);
  if (d === 0) return '오늘';
  if (d === 1) return '어제';
  if (d < 7)  return `${d}일 전`;
  if (d < 30) return `${Math.floor(d/7)}주 전`;
  return `${Math.floor(d/30)}개월 전`;
}

async function openWsOverlay() {
  document.getElementById('ws-overlay').classList.remove('hidden');
  switchWsTab('list');
  await renderWsList();
}
function closeWsOverlay() {
  document.getElementById('ws-overlay').classList.add('hidden');
}

// ── STORAGE KEYS (워크스페이스 기반 동적 키) ======================

// ====================== FIREBASE HELPERS ======================
function waitForFirebase() {
  return new Promise(resolve => {
    if (window._fbReady) { resolve(); return; }
    window.addEventListener('firebase-ready', () => resolve(), { once: true });
  });
}
async function fbSet(path, data) {
  await waitForFirebase();
  return window._fbSet(window._fbRef(window._fbDb, path), data);
}
async function fbGet(path) {
  await waitForFirebase();
  const snap = await window._fbGet(window._fbRef(window._fbDb, path));
  return snap.exists() ? snap.val() : null;
}
async function fbPush(path, data) {
  await waitForFirebase();
  return window._fbPush(window._fbRef(window._fbDb, path), data);
}

// ====================== PERSISTENT STORAGE (Firebase 팀 공유) ======================
async function loadSharedCtx() {
  if (!currentWs) return;
  try {
    if (currentWs.type === 'team') {
      const val = await fbGet(`workspaces/${currentWs.id}/sharedCtx`);
      if (val) { sharedCtx = val; return; }
    }
  } catch(e) { console.warn('Firebase load failed', e); }
  try {
    const v = localStorage.getItem(SHARED_KEY());
    if (v) sharedCtx = JSON.parse(v);
  } catch(_) {}
}

async function saveSharedCtx(data) {
  if (!currentWs) return;
  try {
    if (currentWs.type === 'team') {
      await fbSet(`workspaces/${currentWs.id}/sharedCtx`, data);
      return;
    }
  } catch(e) { console.warn('Firebase save failed', e); }
  try { localStorage.setItem(SHARED_KEY(), JSON.stringify(data)); } catch(_) {}
}

// ====================== LOCAL STORAGE (개인) ======================
function loadPersonalCtx() {
  try {
    const v = localStorage.getItem(PERSONAL_KEY());
    if (v) personalCtx = JSON.parse(v);
  } catch(e) {}
}

function savePersonalCtx(data) {
  try { localStorage.setItem(PERSONAL_KEY(), JSON.stringify(data)); } catch(e) {}
}

function loadLocalState() {
  try {
    const sel = localStorage.getItem(SELECTED_KEY());
    if (sel) JSON.parse(sel).forEach(id => selected.add(id));
    const ci = localStorage.getItem(CUSTOM_KEY());
    if (ci) { const p = JSON.parse(ci); Object.keys(p).forEach(k => { customItems[k] = p[k]; }); }
  } catch(e) {}
}

function saveLocalState() {
  try {
    localStorage.setItem(SELECTED_KEY(), JSON.stringify([...selected]));
    localStorage.setItem(CUSTOM_KEY(), JSON.stringify(customItems));
  } catch(e) {}
}

let ctxPanelOpen = true;

function toggleContextPanel() {
  ctxPanelOpen = !ctxPanelOpen;
  const panel = document.getElementById('context-panel');
  const chev = document.getElementById('ctx-chevron');
  panel.classList.toggle('collapsed', !ctxPanelOpen);
  chev.classList.toggle('open', ctxPanelOpen);
}

function fillInputsFromCtx() {
  if (sharedCtx.topic) document.getElementById('ctx-topic').value = sharedCtx.topic;
  if (sharedCtx.stack) document.getElementById('ctx-stack').value = sharedCtx.stack;
  if (sharedCtx.rules) document.getElementById('ctx-rules').value = sharedCtx.rules;
  if (sharedCtx.extra) document.getElementById('ctx-extra').value = sharedCtx.extra;
  if (personalCtx.part) document.getElementById('ctx-part').value = personalCtx.part;
}

async function saveContext() {
  const btn = document.getElementById('ctx-save-btn');
  const statusEl = document.getElementById('ctx-status');
  const badge = document.getElementById('sync-badge');

  btn.disabled = true;
  statusEl.textContent = '저장 중...';
  statusEl.className = 'ctx-status syncing';
  badge.textContent = '⟳ 동기화 중';
  badge.className = 'sync-badge syncing';

  const newShared = {
    topic: document.getElementById('ctx-topic').value.trim(),
    stack: document.getElementById('ctx-stack').value.trim(),
    rules: document.getElementById('ctx-rules').value.trim(),
    extra: document.getElementById('ctx-extra').value.trim(),
  };
  const newPersonal = {
    part: document.getElementById('ctx-part').value.trim(),
  };

  await saveSharedCtx(newShared);
  savePersonalCtx(newPersonal);
  sharedCtx = newShared;
  personalCtx = newPersonal;

  btn.disabled = false;
  statusEl.textContent = '✓ 저장 완료! 팀 공유 항목이 동기화됐어요';
  statusEl.className = 'ctx-status ok';
  badge.textContent = (currentWs && currentWs.type === 'solo') ? '🔒 개인 전용' : '🔗 공유됨';
  badge.className = (currentWs && currentWs.type === 'solo') ? 'sync-badge personal' : 'sync-badge shared';

  updateBanner();
  updatePrompt();

  // 패널 접기
  setTimeout(() => {
    toggleContextPanel();
  }, 800);
}

function updateBanner() {
  const banner = document.getElementById('context-banner');
  const tags = [];
  if (sharedCtx.topic) tags.push({ label: '주제', val: sharedCtx.topic, cls: '' });
  if (sharedCtx.stack) tags.push({ label: '스택', val: sharedCtx.stack, cls: '' });
  if (sharedCtx.rules) tags.push({ label: '규칙', val: sharedCtx.rules.substring(0,30) + (sharedCtx.rules.length>30?'…':''), cls: '' });
  if (personalCtx.part) tags.push({ label: '내 파트', val: personalCtx.part, cls: ' personal-tag' });

  if (tags.length) {
    banner.classList.add('visible');
    banner.innerHTML =
      '<span class="ctx-banner-label">컨텍스트 →</span>' +
      tags.map(t => `<span class="ctx-tag${t.cls}">${t.label}: ${escHtml(t.val)}</span>`).join('') +
      '<button class="ctx-edit-btn" onclick="openContextPanel()">수정</button>';
  } else {
    banner.classList.remove('visible');
  }
}

function openContextPanel() {
  if (!ctxPanelOpen) toggleContextPanel();
}

  try {
    const raw = localStorage.getItem(VIEW_BUILDER_KEY);

    const data = JSON.parse(raw);
    // DOM이 아직 없을 수 있으니 buildOptions 후에 호출
    window._pendingViewRestore = data;
  } catch(e) {}
}

function restoreViewBuilderInputs() {
  const data = window._pendingViewRestore;
  if (!data) return;
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  set('view-page-name', data.pageName);
  set('view-page-desc', data.pageDesc);
  set('view-tech',      data.tech);
  set('view-features',  data.features);
  set('view-api',       data.apiInfo);
  set('view-ref-link',  data.refLink);
  if (data.moods) {
    viewMoodsSelected = new Set(data.moods);
    document.querySelectorAll('.mood-chip').forEach(el => {
      el.classList.toggle('active', viewMoodsSelected.has(el.dataset.mood));
    });
  }
  window._pendingViewRestore = null;
}

function toggleMood(mood) {
  if (viewMoodsSelected.has(mood)) viewMoodsSelected.delete(mood);
  else viewMoodsSelected.add(mood);
  document.querySelectorAll('.mood-chip').forEach(el => {
    el.classList.toggle('active', viewMoodsSelected.has(el.dataset.mood));
  });
  saveViewBuilder();
}

function applyViewPrompt() {
  const pageName  = document.getElementById('view-page-name').value.trim();
  const pageDesc  = document.getElementById('view-page-desc').value.trim();
  const techStack = document.getElementById('view-tech').value.trim() || 'React';

  const apiInfo   = document.getElementById('view-api').value.trim();
  const refLink   = document.getElementById('view-ref-link').value.trim();
  const moods     = [...viewMoodsSelected];

  if (!pageName) {
    const el = document.getElementById('view-page-name');
    el.focus();
    el.style.borderColor = 'var(--red)';
    setTimeout(() => el.style.borderColor = '', 1500);
    return;
  }

  viewPromptActive = true;

  let prompt = `${techStack}로 [${pageName}] 페이지/컴포넌트를 만들어줘.`;
  if (pageDesc)  prompt += `\n\n이 페이지의 역할: ${pageDesc}`;
  if (features)  prompt += `\n\n포함할 기능/요구사항: ${features}`;
  if (moods.length) prompt += `\n\n디자인 방향: ${moods.join(', ')}`;
  if (apiInfo)   prompt += `\n\nAPI 연동 정보: ${apiInfo}`;
  if (refLink)   prompt += `\n\n참고 사이트/디자인 레퍼런스: ${refLink}`;
  prompt += '\n\n실제 프로젝트에 바로 붙일 수 있는 완성된 컴포넌트로 작성해줘. 임시 데이터는 주석이나 TODO로 표시해줘.';

  window._viewGeneratedPrompt = { id: 'view_generated', prompt, label: `[뷰] ${pageName}` };

  saveViewBuilder();
  updatePrompt();
  saveLocalState();

  const btn = document.getElementById('view-apply-btn');
  btn.textContent = '✓ 적용됨';
  btn.style.background = 'var(--teal)';
  btn.style.color = '#000';
  setTimeout(() => {
    btn.innerHTML = '→ 프롬프트에 추가';
    btn.style.background = '';
    btn.style.color = '';
  }, 1500);
}

              <div class="item-label">${item.label}</div>
              <div class="item-sub">${item.sub}</div>
            </div>
          </label>
        `).join('')}
        <div class="custom-items-wrap" id="custom-wrap-${sec.id}"></div>
        <div class="add-trigger" id="add-trig-${sec.id}" onclick="showAddForm('${sec.id}')">
          <span>+</span> 커스텀 항목 추가
        </div>
        <div class="add-form" id="add-form-${sec.id}">
          <div>
            <div class="add-field-label">항목 이름</div>
            <input class="custom-input" id="add-label-${sec.id}" placeholder="예) 내가 자주 쓰는 요청" />
          </div>
          <div>
            <div class="add-field-label">프롬프트 내용</div>
            <textarea class="custom-input" id="add-prompt-${sec.id}" rows="3" placeholder="Claude에게 보낼 실제 프롬프트 내용을 입력해줘"></textarea>
          </div>
          <div class="add-actions">
            <button class="add-cancel" onclick="hideAddForm('${sec.id}')">취소</button>
            <button class="add-save" onclick="saveNew('${sec.id}')">저장</button>
          </div>
        </div>
      </div>
    `;
    panel.appendChild(div);
  });

  // 저장된 선택 상태 복원
  DATA.forEach(sec => {
    sec.items.forEach(item => {
      if (selected.has(item.id)) {
        const cb = document.getElementById('cb-' + item.id);
        const lbl = document.getElementById('item-' + item.id);
        if (cb) cb.checked = true;
        if (lbl) lbl.classList.add('checked');
      }
    });
    renderCustomItems(sec.id);
    updateSecCount(sec.id);
  });

  // 뷰 빌더 입력값 복원 (DOM이 생긴 후)
  restoreViewBuilderInputs();
}

// ====================== TOGGLE SECTION ======================
function toggleSec(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  if (collapsed.has(id)) {
    collapsed.delete(id);
    body.classList.remove('collapsed');
    chev.classList.add('open');
  } else {
    collapsed.add(id);
    body.classList.add('collapsed');
    chev.classList.remove('open');
  }
}

// ====================== TOGGLE ITEM ======================
function toggle(itemId, secId, checked) {
  if (checked) selected.add(itemId); else selected.delete(itemId);
  const lbl = document.getElementById('item-' + itemId);
  if (lbl) lbl.classList.toggle('checked', checked);
  updateSecCount(secId);
  updatePrompt();
  saveLocalState();
}

function toggleCustom(itemId, secId, checked) {
  if (checked) selected.add(itemId); else selected.delete(itemId);
  const lbl = document.getElementById('citem-' + itemId);
  if (lbl) lbl.classList.toggle('checked', checked);
  updateSecCount(secId);
  updatePrompt();
  saveLocalState();
}

// ====================== SECTION COUNT ======================
function updateSecCount(secId) {
  const sec = DATA.find(s => s.id === secId);
  if (!sec) return;
  const presetN = sec.items.filter(i => selected.has(i.id)).length;
  const customN = (customItems[secId] || []).filter(i => selected.has(i.id)).length;
  const n = presetN + customN;
  const el = document.getElementById('cnt-' + secId);
  const secEl = document.getElementById('sec-' + secId);
  el.textContent = n;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  secEl.classList.toggle('has-checked', n > 0);
}

// ====================== CUSTOM ITEMS ======================
function showAddForm(secId) {
  document.getElementById('add-form-' + secId).classList.add('open');
  document.getElementById('add-trig-' + secId).style.display = 'none';
  document.getElementById('add-label-' + secId).focus();
}
function hideAddForm(secId) {
  const form = document.getElementById('add-form-' + secId);
  form.classList.remove('open');
  document.getElementById('add-label-' + secId).value = '';
  document.getElementById('add-prompt-' + secId).value = '';
  document.getElementById('add-trig-' + secId).style.display = '';
}
function saveNew(secId) {
  const label = document.getElementById('add-label-' + secId).value.trim();
  const prompt = document.getElementById('add-prompt-' + secId).value.trim();
  if (!label || !prompt) return;
  if (!customItems[secId]) customItems[secId] = [];
  const id = 'c_' + secId + '_' + Date.now();
  customItems[secId].push({ id, label, prompt });
  hideAddForm(secId);
  renderCustomItems(secId);
  saveLocalState();
}
function removeCustom(secId, itemId) {
  if (!customItems[secId]) return;
  customItems[secId] = customItems[secId].filter(i => i.id !== itemId);
  selected.delete(itemId);
  updateSecCount(secId);
  renderCustomItems(secId);
  updatePrompt();
  saveLocalState();
}
function renderCustomItems(secId) {
  const wrap = document.getElementById('custom-wrap-' + secId);
  if (!wrap) return;
  const items = customItems[secId] || [];
  wrap.innerHTML = items.map(item => {
    const isChecked = selected.has(item.id);
    const preview = item.prompt.length > 45 ? item.prompt.substring(0, 45) + '…' : item.prompt;
    return `<label class="custom-item${isChecked ? ' checked' : ''}" id="citem-${item.id}">
      <input type="checkbox" id="ccb-${item.id}" ${isChecked ? 'checked' : ''} onchange="toggleCustom('${item.id}','${secId}',this.checked)">
      <div style="flex:1;min-width:0;">
        <div class="item-label">${escHtml(item.label)}</div>
        <div class="item-sub" style="word-break:break-all;">${escHtml(preview)}</div>
      </div>
      <button class="custom-del" onclick="event.preventDefault();removeCustom('${secId}','${item.id}')">✕</button>
    </label>`;
  }).join('');
}

// ====================== UPDATE PROMPT ======================
function updatePrompt() {
  const emptyEl = document.getElementById('empty-state');
  const blocksEl = document.getElementById('prompt-blocks');
  const statItems = document.getElementById('stat-items');
  const statChars = document.getElementById('stat-chars');
  const hchip = document.getElementById('header-chip');

  const ctx = { ...sharedCtx, ...personalCtx };
  const hasCtx = Object.values(ctx).some(v => v);
  const hasView = viewPromptActive && window._viewGeneratedPrompt;

  if (selected.size === 0 && !hasCtx && !hasView) {
    emptyEl.style.display = 'flex';
    blocksEl.innerHTML = '';
    statItems.textContent = '0';
    statChars.textContent = '0';
    hchip.textContent = '0개 선택됨';
    hchip.className = 'hchip';
    return;
  }

  emptyEl.style.display = 'none';
  let html = '';
  let totalChars = 0;

  // 컨텍스트 블록
  if (hasCtx) {
    const ctxLines = [];
    if (ctx.topic) ctxLines.push(`프로젝트 주제: ${ctx.topic}`);
    if (ctx.stack) ctxLines.push(`기술 스택: ${ctx.stack}`);
    if (ctx.rules) ctxLines.push(`팀 규칙/컨벤션: ${ctx.rules}`);
    if (ctx.extra) ctxLines.push(`추가 정보: ${ctx.extra}`);
    if (ctx.part)  ctxLines.push(`내가 맡은 파트: ${ctx.part}`);
    if (ctxLines.length) {
      ctxLines.forEach(l => { totalChars += l.length; });
      html += `<div class="pblock">
        <div class="psec-label">프로젝트 컨텍스트</div>
        ${ctxLines.map(l => `<div class="pline c-purple">${escHtml(l)}</div>`).join('')}
      </div>`;
    }
  }

  // 뷰 빌더 블록
  if (hasView) {
    const vp = window._viewGeneratedPrompt;
    totalChars += vp.prompt.length;
    html += `<div class="pblock">
      <div class="psec-label" style="color:var(--teal)">🎨 뷰 생성 요청</div>
      <div class="pline c-teal" style="white-space:pre-wrap">${escHtml(vp.prompt)}</div>
    </div>`;
  }

  DATA.forEach(sec => {
    const items = sec.items.filter(i => selected.has(i.id));
    const customs = (customItems[sec.id] || []).filter(i => selected.has(i.id));
    if (!items.length && !customs.length) return;

    html += `<div class="pblock">
      <div class="psec-label">${sec.title}</div>
      ${items.map(i => {
        totalChars += i.prompt.length;
        return `<div class="pline ${sec.colorClass}">${escHtml(i.prompt)}</div>`;
      }).join('')}
      ${customs.map(i => {
        totalChars += i.prompt.length;
        return `<div class="pline ${sec.colorClass}">${escHtml(i.prompt)}</div>`;
      }).join('')}
    </div>`;
  });

  // 추가 입력 블록
  const extra = getExtraInput();
  if (extra) {
    totalChars += extra.length;
    html += `<div class="pblock">
      <div class="psec-label" style="color:var(--amber)">✏️ 추가 입력</div>
      <div class="pline c-amber" style="white-space:pre-wrap">${escHtml(extra)}</div>
    </div>`;
  }

  blocksEl.innerHTML = html;
  const totalItems = selected.size + (hasView ? 1 : 0);
  statItems.textContent = totalItems;
  statChars.textContent = totalChars;
  hchip.textContent = `${totalItems}개 선택됨`;
  hchip.className = 'hchip active';
}

// ====================== COPY / CLEAR ======================
function buildFullPrompt(withHeaders) {
  const parts = [];
  const ctx = { ...sharedCtx, ...personalCtx };
  const hasCtx = Object.values(ctx).some(v => v);
  const hasView = viewPromptActive && window._viewGeneratedPrompt;

  if (hasCtx) {
    const ctxLines = [];
    if (ctx.topic) ctxLines.push(`프로젝트 주제: ${ctx.topic}`);
    if (ctx.stack) ctxLines.push(`기술 스택: ${ctx.stack}`);
    if (ctx.rules) ctxLines.push(`팀 규칙/컨벤션: ${ctx.rules}`);
    if (ctx.extra) ctxLines.push(`추가 정보: ${ctx.extra}`);
    if (ctx.part)  ctxLines.push(`내가 맡은 파트: ${ctx.part}`);
    if (ctxLines.length) {
      if (withHeaders) parts.push(`## 프로젝트 컨텍스트\n${ctxLines.join('\n')}`);
      else parts.push(ctxLines.join('\n'));
    }
  }

  if (hasView) {
    const vp = window._viewGeneratedPrompt;
    if (withHeaders) parts.push(`## 🎨 뷰 생성 요청\n${vp.prompt}`);
    else parts.push(vp.prompt);
  }

  DATA.forEach(sec => {
    const items = sec.items.filter(i => selected.has(i.id));
    const customs = (customItems[sec.id] || []).filter(i => selected.has(i.id));
    if (!items.length && !customs.length) return;
    const texts = [...items.map(i => i.prompt), ...customs.map(i => i.prompt)];
    if (withHeaders) parts.push(`## ${sec.title}\n${texts.join('\n')}`);
    else parts.push(texts.join('\n'));
  });
  const extra = getExtraInput();
  if (extra) {
    if (withHeaders) parts.push(`## ✏️ 추가 입력\n${extra}`);
    else parts.push(extra);
  }
  return parts.join('\n\n');
}

function copyFull() {
  const prompt = buildFullPrompt(true);
  if (!prompt) return;
  navigator.clipboard.writeText(prompt).then(() => {
    showToast();
    recordActivity();
  });
}
function copyRaw() {
  const prompt = buildFullPrompt(false);
  if (!prompt) return;
  navigator.clipboard.writeText(prompt).then(() => {
    showToast();
    recordActivity();
  });
}

function recordActivity() {
  if (!currentWs || currentWs.type !== 'team') return;
  const tags = makeFeedTags();
  if (!tags.length) return;
  const part = personalCtx.part || '익명';
  const item = { part, tags, ts: Date.now() };
  saveFeedItem(currentWs.id, item);
}
function clearAll() {
  selected.clear();
  viewPromptActive = false;
  window._viewGeneratedPrompt = null;
  viewMoodsSelected.clear();
  // 뷰 빌더 입력 초기화
  ['view-page-name','view-page-desc','view-tech','view-features','view-api','view-ref-link'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.querySelectorAll('.mood-chip').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  document.querySelectorAll('.item, .custom-item').forEach(el => el.classList.remove('checked'));
  DATA.forEach(sec => updateSecCount(sec.id));
  const extraEl = document.getElementById('extra-input');
  if (extraEl) extraEl.value = '';
  try { localStorage.removeItem(VIEW_BUILDER_KEY); } catch(e) {}
  updatePrompt();
  saveLocalState();
}

function clearExtra() {
  const el = document.getElementById('extra-input');
  if (el) el.value = '';
  updatePrompt();
}

function getExtraInput() {
  return document.getElementById('extra-input')?.value.trim() || '';
}
function showToast() { showToastMsg('✓ 클립보드에 복사됨'); }
function showToastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ====================== WORKSPACE SWITCH ======================
async function resetToWs(ws) {
  // 상태 초기화
  selected.clear();
  Object.keys(customItems).forEach(k => delete customItems[k]);
  sharedCtx = {};
  personalCtx = {};
  viewPromptActive = false;
  window._viewGeneratedPrompt = null;

  // 새 워크스페이스 데이터 로드
  loadLocalState();
  loadPersonalCtx();
  await loadSharedCtx();

  fillInputsFromCtx();
  updateBanner();

  // 컨텍스트 패널 상태
  const hasCtx = Object.values(sharedCtx).some(v => v) || Object.values(personalCtx).some(v => v);
  const panel = document.getElementById('context-panel');
  const chev  = document.getElementById('ctx-chevron');
  ctxPanelOpen = !hasCtx;
  panel.classList.toggle('collapsed', !ctxPanelOpen);
  chev.classList.toggle('open', ctxPanelOpen);

  // 싱크 뱃지 타입 반영
  const badge = document.getElementById('sync-badge');
  if (ws.type === 'solo') {
    badge.textContent = '🔒 개인 전용';
    badge.className = 'sync-badge personal';
  } else {
    badge.textContent = '🔗 공유됨';
    badge.className = 'sync-badge shared';
  }

  buildOptions();
  updatePrompt();
}

// ====================== INIT ======================
async function init() {
  loadViewBuilder();

  // 마지막으로 쓴 워크스페이스 복원
  let wsId = null;
  try { wsId = localStorage.getItem(WS_CURRENT_KEY); } catch(e) {}

  const list = loadWsList();

  if (wsId) {
    const found = list.find(w => w.id === wsId);
    if (found) {
      currentWs = found;
      updateWsHeader();
      closeWsOverlay();
      await resetToWs(found);
      return;
    }
  }

  // 저장된 ws 없으면 오버레이 표시
  if (list.length === 0) {
    // 첫 사용자 → 오버레이 열기
    openWsOverlay();
    // 그래도 기본 UI는 렌더
    buildOptions();
    updatePrompt();
  } else {
    // 목록은 있는데 current 없음 → 목록 보여주기
    openWsOverlay();
    buildOptions();
    updatePrompt();
  }
}

init();
</script>
