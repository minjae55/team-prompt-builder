<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHy7x7gSC7rc6v4Ng0K9Pz5PqwSkUBHIg",
  authDomain: "kbeauty-ea966.firebaseapp.com",
  databaseURL: "https://kbeauty-ea966-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kbeauty-ea966",
  storageBucket: "kbeauty-ea966.firebasestorage.app",
  messagingSenderId: "348140230496",
  appId: "1:348140230496:web:bcd5109f93ec58568e3005"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// 전역으로 노출 (일반 script에서 접근)
window._fbDb  = db;
window._fbRef = ref;
window._fbSet = set;
window._fbGet = get;
window._fbPush = push;
window._fbReady = true;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
:root {
  --bg:        #0a0c10;
  --bg2:       #0f1218;
  --bg3:       #161b24;
  --bg4:       #1c2330;
  --border:    #1e2736;
  --border2:   #28364a;
  --text:      #e2e8f0;
  --text2:     #8899b4;
  --text3:     #4a5d78;
  --green:     #00d084;
  --green-bg:  #021a10;
  --blue:      #3b9eff;
  --blue-bg:   #021428;
  --amber:     #ffb043;
  --amber-bg:  #1a1200;
  --red:       #ff5c7a;
  --red-bg:    #1f0a10;
  --purple:    #a78bfa;
  --purple-bg: #130f24;
  --teal:      #2dd4bf;
  --teal-bg:   #021614;
  --radius:    10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 23px,
      rgba(59,158,255,0.02) 23px,
      rgba(59,158,255,0.02) 24px
    );
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 100;
  height: 54px;
  background: rgba(10,12,16,0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  color: #fff;
}
.logo-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  letter-spacing: 0.03em;
}
.logo-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--purple);
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.25);
  padding: 2px 8px;
  border-radius: 20px;
}
.header-right { display: flex; align-items: center; gap: 8px; }
.hchip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: var(--bg3);
}
.hchip.active {
  background: var(--purple-bg);
  border-color: rgba(167,139,250,0.35);
  color: var(--purple);
}

/* ── CONTEXT PANEL ── */
.context-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  max-height: 600px;
  position: relative;
  z-index: 1;
}
.context-panel.collapsed { max-height: 0; }

.ctx-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.ctx-panel-header:hover { background: var(--bg3); }
.ctx-panel-header-left { display: flex; align-items: center; gap: 10px; }
.ctx-panel-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.05em;
}

/* 공유 vs 개인 배지 */
.sync-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.sync-badge.shared {
  color: var(--green); background: var(--green-bg);
  border: 1px solid rgba(0,208,132,0.25);
}
.sync-badge.personal {
  color: var(--amber); background: var(--amber-bg);
  border: 1px solid rgba(255,176,67,0.25);
}
.sync-badge.syncing {
  color: var(--blue); background: var(--blue-bg);
  border: 1px solid rgba(59,158,255,0.25);
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.ctx-chevron { color: var(--text3); font-size: 10px; transition: transform 0.2s; }
.ctx-chevron.open { transform: rotate(180deg); }

.ctx-fields-wrap {
  padding: 16px 22px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ctx-field { display: flex; flex-direction: column; gap: 5px; }
.ctx-field-full { grid-column: 1 / -1; }

.ctx-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.ctx-field-label .field-badge {
  font-size: 8px; padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
}
.field-badge.shared { color: var(--green); background: var(--green-bg); border: 1px solid rgba(0,208,132,0.2); }
.field-badge.personal { color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(255,176,67,0.2); }

.ctx-input {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 8px 11px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
  width: 100%;
}
.ctx-input.shared-field:focus { border-color: var(--green); }
.ctx-input.personal-field:focus { border-color: var(--amber); }
.ctx-input::placeholder { color: var(--text3); }

.ctx-footer {
  padding: 10px 22px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ctx-save-btn {
  padding: 7px 18px;
  background: var(--green-bg);
  border: 1px solid rgba(0,208,132,0.3);
  border-radius: var(--radius-sm);
  color: var(--green);
  font-family: 'Pretendard', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
}
.ctx-save-btn:hover { background: var(--green); color: #000; }
.ctx-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.ctx-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.ctx-status.ok { color: var(--green); }
.ctx-status.err { color: var(--red); }
.ctx-status.syncing { color: var(--blue); }

/* ── CONTEXT BANNER ── */
.context-banner {
  display: none;
  padding: 8px 22px;
  background: linear-gradient(90deg, rgba(19,15,36,0.85), transparent);
  border-bottom: 1px solid rgba(167,139,250,0.12);
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  position: relative; z-index: 1;
}
.context-banner.visible { display: flex; }
.ctx-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid rgba(167,139,250,0.22);
  color: var(--purple);
  background: var(--purple-bg);
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ctx-tag.personal-tag {
  border-color: rgba(255,176,67,0.22);
  color: var(--amber);
  background: var(--amber-bg);
}
.ctx-banner-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
}
.ctx-edit-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: transparent;
  cursor: pointer;
  transition: all 0.12s;
  margin-left: auto;
}
.ctx-edit-btn:hover { color: var(--text2); border-color: var(--border2); background: var(--bg3); }

/* ── MAIN LAYOUT ── */
.main {
  position: relative; z-index: 1;
  display: flex;
  height: calc(100vh - 54px);
  overflow: hidden;
}

/* ── PROMPT PANEL (left) ── */
.prompt-panel {
  width: 360px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  height: 100%;
  overflow: hidden;
}
.panel-head {
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.panel-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
}
.panel-stats { display: flex; gap: 14px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.stat-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 700;
  color: var(--purple);
  line-height: 1;
}
.stat-l { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); }

.prompt-output {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.prompt-output::-webkit-scrollbar { width: 4px; }
.prompt-output::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.empty-state {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  color: var(--text3);
}
.empty-icon {
  width: 52px; height: 52px;
  border: 1px dashed var(--border2);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.empty-state p {
  font-size: 12px; text-align: center;
  line-height: 1.7; max-width: 200px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
}

/* prompt blocks */
.pblock { margin-bottom: 18px; }
.pblock:last-child { margin-bottom: 0; }
.psec-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.psec-label::before {
  content: ''; width: 14px; height: 1px;
  background: var(--border2);
}
.pline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px; line-height: 1.75;
  color: var(--text2);
  padding: 9px 12px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--border2);
  margin-bottom: 5px;
}
.pline:last-child { margin-bottom: 0; }
.pline.c-green  { border-left-color: var(--green); }
.pline.c-blue   { border-left-color: var(--blue); }
.pline.c-amber  { border-left-color: var(--amber); }
.pline.c-red    { border-left-color: var(--red); }
.pline.c-purple { border-left-color: var(--purple); }
.pline.c-teal   { border-left-color: var(--teal); }

/* action buttons */
.panel-actions {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 7px;
  flex-shrink: 0;
  background: var(--bg2);
}
.btn {
  width: 100%;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-family: 'Pretendard', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
  font-weight: 700;
}
.btn-primary:hover { background: #b89ffb; }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary {
  background: var(--bg3); color: var(--text2);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--bg4); color: var(--text); border-color: var(--border2); }
.btn-ghost {
  background: transparent; color: var(--text3);
  border-color: var(--border); font-size: 12px;
}
.btn-ghost:hover { color: var(--red); border-color: rgba(255,92,122,0.35); background: var(--red-bg); }
.btn-row { display: flex; gap: 7px; }
.btn-row .btn { flex: 1; }

/* ── OPTIONS PANEL (right) ── */
.options-panel {
  flex: 1;
  overflow-y: auto;
  height: 100%;
  padding: 18px 22px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.options-panel::-webkit-scrollbar { width: 4px; }
.options-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section {
  margin-bottom: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.section:hover { border-color: var(--border2); }
.section.has-checked { border-color: var(--border2); }

.sec-head {
  padding: 11px 15px;
  display: flex; align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.sec-head:hover { background: var(--bg3); }
.sec-head-left { display: flex; align-items: center; gap: 9px; }

.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.badge-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid rgba(0,208,132,0.2); }
.badge-blue   { background: var(--blue-bg);   color: var(--blue);   border: 1px solid rgba(59,158,255,0.2); }
.badge-amber  { background: var(--amber-bg);  color: var(--amber);  border: 1px solid rgba(255,176,67,0.2); }
.badge-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid rgba(255,92,122,0.2); }
.badge-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.2); }
.badge-teal   { background: var(--teal-bg);   color: var(--teal);   border: 1px solid rgba(45,212,191,0.2); }

.sec-title { font-size: 13px; font-weight: 600; color: var(--text); }
.sec-cnt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  background: var(--purple-bg);
  color: var(--purple);
  padding: 2px 6px; border-radius: 10px;
  border: 1px solid rgba(167,139,250,0.25);
  display: none;
}
.chevron { color: var(--text3); font-size: 10px; transition: transform 0.18s; }
.chevron.open { transform: rotate(180deg); }

.sec-body {
  border-top: 1px solid var(--border);
  padding: 7px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.sec-body.collapsed { display: none; }

.item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.item:hover { background: var(--bg3); border-color: var(--border); }
.item.checked {
  background: var(--purple-bg);
  border-color: rgba(167,139,250,0.2);
}
.item input[type=checkbox] {
  width: 13px; height: 13px;
  margin-top: 2px; cursor: pointer;
  flex-shrink: 0;
  accent-color: var(--purple);
}
.item-label { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
.item-sub {
  font-size: 10.5px; color: var(--text3);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.4;
}

/* custom items */
.custom-items-wrap {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.add-trigger {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 12px; margin-top: 3px;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text3);
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: all 0.14s;
  user-select: none;
}
.add-trigger:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-bg); }

.add-form {
  grid-column: 1 / -1;
  display: none; flex-direction: column; gap: 8px;
  padding: 10px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  margin-top: 4px;
}
.add-form.open { display: flex; }
.add-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 3px;
}
.custom-input {
  width: 100%;
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
}
.custom-input:focus { border-color: var(--purple); }
.custom-input::placeholder { color: var(--text3); }
.add-actions { display: flex; gap: 6px; justify-content: flex-end; }
.add-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text3);
  font-family: 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 600;
  padding: 5px 10px; cursor: pointer;
}
.add-cancel:hover { color: var(--text2); }
.add-save {
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.3);
  border-radius: var(--radius-sm);
  color: var(--purple);
  font-family: 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 5px 12px; cursor: pointer;
  transition: all 0.14s;
}
.add-save:hover { background: var(--purple); color: #fff; }

.custom-item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.custom-item:hover { background: var(--bg3); border-color: var(--border); }
.custom-item.checked { background: var(--purple-bg); border-color: rgba(167,139,250,0.2); }
.custom-item input[type=checkbox] { width: 13px; height: 13px; margin-top: 2px; accent-color: var(--purple); flex-shrink: 0; cursor: pointer; }
.custom-del {
  background: transparent; border: none;
  color: var(--text3); cursor: pointer;
  font-size: 12px; padding: 1px 5px;
  border-radius: 4px;
  transition: color 0.14s, background 0.14s;
  margin-left: auto; flex-shrink: 0;
}
.custom-del:hover { color: var(--red); background: var(--red-bg); }

/* toast */
.toast {
  position: fixed; bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--purple); color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 700;
  padding: 9px 20px; border-radius: 30px;
  z-index: 999;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── LEGEND ── */
.legend {
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text3);
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 6px; height: 6px; border-radius: 50%; }
.legend-dot.shared { background: var(--green); }
.legend-dot.personal { background: var(--amber); }

/* ── VIEW BUILDER ── */
.view-builder {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, rgba(2,22,20,0.8), rgba(15,18,24,0.8));
  border: 1px solid rgba(45,212,191,0.2);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 6px;
}
.view-builder-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.view-builder-dot {
  width: 7px; height: 7px;
  background: var(--teal);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--teal);
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow { 0%,100%{opacity:1;box-shadow:0 0 6px var(--teal)} 50%{opacity:0.5;box-shadow:0 0 2px var(--teal)} }
.view-builder-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--teal);
}
.view-builder-desc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  margin-left: auto;
}

.view-field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.view-field { display: flex; flex-direction: column; gap: 4px; }
.view-field-full { grid-column: 1 / -1; }
.view-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
}
.view-input {
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.14s;
  resize: none;
  width: 100%;
}
.view-input:focus { border-color: var(--teal); }
.view-input::placeholder { color: var(--text3); }

.mood-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}
.mood-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}
.mood-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  background: transparent;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}
.mood-chip:hover { border-color: var(--teal); color: var(--teal); background: rgba(45,212,191,0.05); }
.mood-chip.active {
  background: var(--teal-bg);
  border-color: rgba(45,212,191,0.45);
  color: var(--teal);
}

.view-footer {
  display: flex; align-items: center; gap: 10px;
  justify-content: space-between;
  margin-top: 4px;
}
.view-preview-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  font-style: italic;
}
.view-apply-btn {
  padding: 7px 18px;
  background: var(--teal-bg);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: var(--radius-sm);
  color: var(--teal);
  font-family: 'Pretendard', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: all 0.14s;
  display: flex; align-items: center; gap: 6px;
}
.view-apply-btn:hover { background: var(--teal); color: #000; }

.view-divider {
  height: 1px; background: var(--border);
  margin: 10px 0;
  grid-column: 1 / -1;
}
.view-options-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  grid-column: 1 / -1;
  margin-bottom: 2px;
}

/* ── WORKSPACE OVERLAY ── */
.ws-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.ws-overlay.hidden { display: none; }

.ws-modal {
  width: 100%; max-width: 520px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.ws-modal-head {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--border);
}
.ws-modal-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.ws-modal-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 700; color: #fff;
}
.ws-modal-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  line-height: 1.2;
}
.ws-modal-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

.ws-tabs {
  display: flex; gap: 0;
  background: var(--bg3);
  border-radius: 8px;
  padding: 3px;
  width: fit-content;
}
.ws-tab {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text3);
  transition: all 0.15s;
  user-select: none;
  border: none; background: transparent;
}
.ws-tab.active { background: var(--bg4); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

.ws-modal-body { padding: 20px 28px 24px; }

/* 방 목록 */
.ws-room-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-height: 60px; }
.ws-room-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
}
.ws-room-item:hover { border-color: var(--purple); background: var(--purple-bg); }
.ws-room-item.personal { }
.ws-room-item.personal:hover { border-color: var(--amber); background: var(--amber-bg); }

.ws-room-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: var(--bg4);
}
.ws-room-icon.team { background: var(--purple-bg); }
.ws-room-icon.personal { background: var(--amber-bg); }

.ws-room-info { flex: 1; min-width: 0; }
.ws-room-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-room-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 2px; }

.ws-room-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.ws-room-badge.team { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.25); }
.ws-room-badge.solo { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,176,67,0.25); }

.ws-room-del {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: transparent; border: none;
  color: var(--text3); font-size: 12px;
  padding: 4px 7px; border-radius: 4px;
  cursor: pointer; opacity: 0;
  transition: all 0.12s;
}
.ws-room-item:hover .ws-room-del { opacity: 1; }
.ws-room-del:hover { color: var(--red); background: var(--red-bg); }

.ws-empty-rooms {
  text-align: center; padding: 20px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text3);
}

/* 새 방 만들기 폼 */
.ws-new-form { display: flex; flex-direction: column; gap: 12px; }
.ws-field { display: flex; flex-direction: column; gap: 5px; }
.ws-field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
}
.ws-input {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.14s;
  width: 100%;
}
.ws-input:focus { border-color: var(--purple); }
.ws-input::placeholder { color: var(--text3); }

.ws-type-select {
  display: flex; gap: 8px;
}
.ws-type-btn {
  flex: 1; padding: 10px 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.14s;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  user-select: none;
}
.ws-type-btn:hover { border-color: var(--border2); background: var(--bg4); }
.ws-type-btn.selected.team { border-color: rgba(167,139,250,0.5); background: var(--purple-bg); }
.ws-type-btn.selected.solo { border-color: rgba(255,176,67,0.5); background: var(--amber-bg); }
.ws-type-icon { font-size: 20px; }
.ws-type-label { font-size: 12px; font-weight: 700; color: var(--text); }
.ws-type-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); text-align: center; }

.ws-code-row { display: flex; gap: 6px; align-items: center; }
.ws-code-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text3);
  line-height: 1.5;
}

.ws-create-btn {
  width: 100%;
  padding: 11px;
  background: var(--purple);
  border: none; border-radius: var(--radius-sm);
  color: #fff;
  font-family: 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.ws-create-btn:hover { background: #b89ffb; }
.ws-create-btn:active { transform: scale(0.98); }

/* 방 참가 탭 */
.ws-join-form { display: flex; flex-direction: column; gap: 12px; }
.ws-join-btn {
  width: 100%; padding: 11px;
  background: var(--blue-bg);
  border: 1px solid rgba(59,158,255,0.3);
  border-radius: var(--radius-sm);
  color: var(--blue);
  font-family: 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.ws-join-btn:hover { background: var(--blue); color: #fff; }

/* 헤더 워크스페이스 표시 */
.ws-header-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 12px 4px 8px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}
.ws-header-btn:hover { border-color: var(--purple); background: var(--purple-bg); }
.ws-header-icon { font-size: 13px; }
.ws-header-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  color: var(--text2);
  max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ws-header-type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  padding: 1px 6px; border-radius: 10px;
}
.ws-header-type.team { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(167,139,250,0.25); }
.ws-header-type.solo { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,176,67,0.25); }

/* ── INVITE CODE COPY ── */
.ws-code-copy-btn {
  padding: 8px 14px;
  background: var(--teal-bg);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: var(--radius-sm);
  color: var(--teal);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: all 0.14s;
}
.ws-code-copy-btn:hover { background: var(--teal); color: #000; }
.ws-code-copy-btn.copied { background: var(--green); color: #000; border-color: var(--green); }

/* ── TEAM ACTIVITY FEED ── */
.ws-room-item-wrap { display: flex; flex-direction: column; gap: 0; }
.ws-room-item-wrap .ws-room-item {
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  border-bottom: none;
}
.ws-room-item-wrap .ws-room-item.no-feed {
  border-radius: var(--radius-sm);
  border-bottom: 1px solid var(--border);
}

.ws-activity-panel {
  background: var(--bg4);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s ease;
}
.ws-activity-panel.open { max-height: 260px; }

.ws-activity-header {
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.ws-activity-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
}
.ws-activity-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 4px var(--green);
}
.ws-activity-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
}

.ws-feed-list {
  overflow-y: auto; max-height: 200px;
  padding: 6px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.ws-feed-empty {
  padding: 16px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text3);
  text-align: center;
}
.ws-feed-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 14px;
  transition: background 0.1s;
}
.ws-feed-item:hover { background: rgba(255,255,255,0.02); }
.ws-feed-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--purple-bg);
  border: 1px solid rgba(167,139,250,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; color: var(--purple);
}
.ws-feed-body { flex: 1; min-width: 0; }
.ws-feed-top {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 2px;
}
.ws-feed-part {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 120px;
}
.ws-feed-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--text3);
  flex-shrink: 0;
}
.ws-feed-tags {
  display: flex; flex-wrap: wrap; gap: 3px;
}
.ws-feed-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 1px 6px; border-radius: 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text3);
  white-space: nowrap;
}
.ws-feed-tag.view  { color: var(--teal);   border-color: rgba(45,212,191,0.2);  background: var(--teal-bg); }
.ws-feed-tag.be    { color: var(--green);  border-color: rgba(0,208,132,0.2);   background: var(--green-bg); }
.ws-feed-tag.fe    { color: var(--blue);   border-color: rgba(59,158,255,0.2);  background: var(--blue-bg); }
.ws-feed-tag.debug { color: var(--red);    border-color: rgba(255,92,122,0.2);  background: var(--red-bg); }
.ws-feed-tag.plan  { color: var(--purple); border-color: rgba(167,139,250,0.2); background: var(--purple-bg); }

/* ── EXTRA INPUT ── */
.extra-input-wrap {
  padding: 10px 18px 0;
  flex-shrink: 0;
}
.extra-input-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 5px;
  display: flex; align-items: center; justify-content: space-between;
}
.extra-input-clear {
  background: none; border: none;
  color: var(--text3); font-size: 10px;
  cursor: pointer; font-family: 'JetBrains Mono', monospace;
  padding: 0;
}
.extra-input-clear:hover { color: var(--red); }
.extra-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 9px 11px;
  outline: none;
  resize: none;
  transition: border-color 0.14s;
  line-height: 1.6;
}
.extra-textarea:focus { border-color: var(--purple); }
.extra-textarea::placeholder { color: var(--text3); }
</head>
<body>

<!-- WORKSPACE OVERLAY -->
<div class="ws-overlay" id="ws-overlay" onclick="handleOverlayClick(event)">
  <div class="ws-modal">
    <div class="ws-modal-head">
      <div class="ws-modal-logo">
        <div class="ws-modal-icon">TP</div>
        <div>
          <div class="ws-modal-title">Team Prompt Builder</div>
          <div class="ws-modal-sub">워크스페이스를 선택하거나 새로 만들어요</div>
        </div>
      </div>
      <div class="ws-tabs">
        <button class="ws-tab active" id="tab-list" onclick="switchWsTab('list')">내 워크스페이스</button>
        <button class="ws-tab" id="tab-new" onclick="switchWsTab('new')">새로 만들기</button>
        <button class="ws-tab" id="tab-join" onclick="switchWsTab('join')">초대코드 입장</button>
      </div>
    </div>
    <div class="ws-modal-body">

      <!-- 목록 탭 -->
      <div id="ws-tab-list">
        <div class="ws-room-list" id="ws-room-list"></div>
      </div>

      <!-- 새로 만들기 탭 -->
      <div id="ws-tab-new" style="display:none">
        <div class="ws-new-form">
          <div class="ws-field">
            <div class="ws-field-label">워크스페이스 이름</div>
            <input class="ws-input" id="ws-new-name" placeholder="예) 중고거래 프로젝트, 캡스톤 팀A, 개인 작업" />
          </div>
          <div class="ws-field">
            <div class="ws-field-label">유형</div>
            <div class="ws-type-select">
              <div class="ws-type-btn selected team" id="wstype-team" onclick="selectWsType('team')">
                <span class="ws-type-icon">👥</span>
                <span class="ws-type-label">팀 공유</span>
                <span class="ws-type-sub">컨텍스트를 팀원과<br>함께 공유</span>
              </div>
              <div class="ws-type-btn solo" id="wstype-solo" onclick="selectWsType('solo')">
                <span class="ws-type-icon">🧑‍💻</span>
                <span class="ws-type-label">개인 전용</span>
                <span class="ws-type-sub">나만 쓰는<br>개인 공간</span>
              </div>
            </div>
          </div>
          <div class="ws-field" id="ws-code-field">
            <div class="ws-field-label">초대코드 (팀원에게 공유할 코드)</div>
            <div class="ws-code-row">
              <input class="ws-input" id="ws-new-code" placeholder="자동 생성됩니다" readonly
                style="flex:1;cursor:pointer;color:var(--teal);letter-spacing:0.12em;font-weight:700;"
                onclick="copyInviteCode('ws-new-code')" title="클릭해서 복사" />
              <button class="ws-code-copy-btn" id="copy-new-code-btn" onclick="copyInviteCode('ws-new-code')">📋 복사</button>
              <button onclick="regenCode()" style="padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap;font-family:'JetBrains Mono',monospace;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">↺</button>
            </div>
            <div class="ws-code-hint">클릭하면 복사돼요 · 팀원에게 공유하면 같은 컨텍스트를 함께 써요</div>
          </div>
          <button class="ws-create-btn" onclick="createWorkspace()">+ 워크스페이스 만들기</button>
        </div>
      </div>

      <!-- 초대코드 입장 탭 -->
      <div id="ws-tab-join" style="display:none">
        <div class="ws-join-form">
          <div class="ws-field">
            <div class="ws-field-label">받은 초대코드 입력</div>
            <input class="ws-input" id="ws-join-code" placeholder="예) ABC-1234" style="text-transform:uppercase;letter-spacing:0.1em;" />
          </div>
          <div class="ws-field">
            <div class="ws-field-label">워크스페이스 이름 (내 목록에 표시될 이름)</div>
            <input class="ws-input" id="ws-join-name" placeholder="예) 중고거래 프로젝트" />
          </div>
          <button class="ws-join-btn" onclick="joinWorkspace()">→ 입장하기</button>
        </div>
      </div>

    </div>
  </div>
</div>

<header class="header">
  <div class="logo">
    <div class="logo-icon">TP</div>
    <span class="logo-text">Team Prompt Builder</span>
  </div>
  <div class="header-right">
    <div class="ws-header-btn" id="ws-header-btn" onclick="openWsOverlay()">
      <span class="ws-header-icon" id="ws-header-icon">👥</span>
      <span class="ws-header-name" id="ws-header-name">워크스페이스</span>
      <span class="ws-header-type team" id="ws-header-type">TEAM</span>
    </div>
    <span class="hchip" id="header-chip">0개 선택됨</span>
  </div>
</header>

<!-- CONTEXT PANEL -->
<div class="context-panel" id="context-panel">
  <div class="ctx-panel-header" onclick="toggleContextPanel()">
    <div class="ctx-panel-header-left">
      <span style="font-size:14px">⚙️</span>
      <span class="ctx-panel-title">프로젝트 컨텍스트 설정</span>
      <span class="sync-badge shared" id="sync-badge">🔗 공유됨</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot shared"></div>팀 공유</div>
        <div class="legend-item"><div class="legend-dot personal"></div>개인 저장</div>
      </div>
      <span class="ctx-chevron open" id="ctx-chevron">▼</span>
    </div>
  </div>

  <div class="ctx-fields-wrap" id="ctx-fields-wrap">
    <div class="ctx-field">
      <div class="ctx-field-label">
        🚀 프로젝트 주제
        <span class="field-badge shared">팀 공유</span>
      </div>
      <input class="ctx-input shared-field" id="ctx-topic" placeholder="예) 중고거래 플랫폼, 실시간 채팅 앱" />
    </div>

    <div class="ctx-field">
      <div class="ctx-field-label">
        🛠️ 기술 스택
        <span class="field-badge shared">팀 공유</span>
      </div>
      <input class="ctx-input shared-field" id="ctx-stack" placeholder="예) Spring Boot, JPA, Redis, React" />
    </div>

    <div class="ctx-field ctx-field-full">
      <div class="ctx-field-label">
        📋 팀 규칙 / 컨벤션
        <span class="field-badge shared">팀 공유</span>
      </div>
      <textarea class="ctx-input shared-field" id="ctx-rules" rows="2" placeholder="예) 브랜치 전략: Git Flow, 코드 리뷰 필수, PR 단위 배포, 커밋 컨벤션: Conventional Commits..."></textarea>
    </div>

    <div class="ctx-field ctx-field-full">
      <div class="ctx-field-label">
        📝 추가 컨텍스트
        <span class="field-badge shared">팀 공유</span>
      </div>
      <textarea class="ctx-input shared-field" id="ctx-extra" rows="2" placeholder="예) 팀원 4명, 마감 3주, ERD 설계 완료, 배포 환경: AWS EC2..."></textarea>
    </div>

    <div class="ctx-field ctx-field-full">
      <div class="ctx-field-label">
        🔧 내가 맡은 파트
        <span class="field-badge personal">개인 저장</span>
      </div>
      <input class="ctx-input personal-field" id="ctx-part" placeholder="예) 인증/결제 API, 실시간 알림 서비스, 상품 검색 기능..." />
    </div>
  </div>

  <div class="ctx-footer">
    <button class="ctx-save-btn" id="ctx-save-btn" onclick="saveContext()">✓ 저장 &amp; 적용</button>
    <span class="ctx-status" id="ctx-status">팀 공유 항목은 모든 팀원에게 동기화됩니다</span>
  </div>
</div>

<!-- CONTEXT BANNER -->
<div class="context-banner" id="context-banner"></div>

<div class="main">
  <!-- LEFT: 프롬프트 출력 -->
  <div class="prompt-panel">
    <div class="panel-head">
      <span class="panel-label">// generated prompt</span>
      <div class="panel-stats">
        <div class="stat">
          <span class="stat-n" id="stat-items">0</span>
          <span class="stat-l">항목</span>
        </div>
        <div class="stat">
          <span class="stat-n" id="stat-chars">0</span>
          <span class="stat-l">글자</span>
        </div>
      </div>
    </div>

    <div class="prompt-output" id="prompt-output">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📦</div>
        <p>오른쪽에서<br>항목을 선택하면<br>프롬프트가 생성돼요</p>
      </div>
      <div id="prompt-blocks"></div>
    </div>

    <div class="extra-input-wrap">
      <div class="extra-input-label">
        ✏️ 추가 입력
        <button class="extra-input-clear" onclick="clearExtra()">지우기</button>
      </div>
      <textarea class="extra-textarea" id="extra-input" rows="3"
        oninput="updatePrompt()"
        placeholder="추가로 전달할 내용을 입력해줘&#10;예) 로그인 API는 POST /api/auth/login이고 JWT 써&#10;예) 기존 UserService 코드 참고해서 짜줘"></textarea>
    </div>

    <div class="panel-actions">
      <button class="btn btn-primary" onclick="copyFull()">📋 프롬프트 복사 (헤더 포함)</button>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="copyRaw()">텍스트만 복사</button>
        <button class="btn btn-ghost" onclick="clearAll()">전체 초기화</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: 옵션 선택 -->
  <div class="options-panel" id="options-panel"></div>
</div>

<div class="toast" id="toast">✓ 클립보드에 복사됨</div>

<script src="app.js"></script>
</body>
</html>
